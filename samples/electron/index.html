<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Invoices</title>
  <style>
    body { font: 14px "Segoe UI", sans-serif; margin: 0; background: #f5f5f5; display: flex; flex-direction: column; height: 100vh; }
    .toolbar { display: flex; gap: 8px; padding: 12px; }
    .toolbar.v2 { justify-content: flex-end; }
    button { font: inherit; padding: 4px 14px; }
    form { padding: 0 12px; flex: 1; }
    label { display: block; margin: 4px 0; }
    input { font: inherit; width: 260px; padding: 3px 4px; }
    #status { padding: 6px 12px 10px; }
  </style>
</head>
<body>
  <div class="toolbar" id="toolbar">
    <button id="ExportButton" type="button">Export…</button>
    <button id="RefreshButton" type="button">Refresh</button>
  </div>
  <form onsubmit="return false">
    <label id="CustomerLabel" for="CustomerBox">Customer</label>
    <input id="CustomerBox" type="text">
  </form>
  <div id="status" role="status">Ready</div>
  <script src="index.js"></script>
</body>
</html>
