name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Glasstake.sln

      - name: Build
        run: dotnet build Glasstake.sln -c Release --no-restore

      - name: Test capture
        run: dotnet test Glasstake.Capture.Tests/Glasstake.Capture.Tests.csproj -c Release --no-build --verbosity normal

      - name: Test MCP server
        run: dotnet test Glasstake.Mcp.Tests/Glasstake.Mcp.Tests.csproj -c Release --no-build --verbosity normal

      - name: Test export
        run: dotnet test Glasstake.Export.Tests/Glasstake.Export.Tests.csproj -c Release --no-build --verbosity normal

      # Starts the sample app and drives it through UI Automation (windows-latest has an interactive desktop).
      - name: Test shot lists
        run: dotnet test Glasstake.Direct.Tests/Glasstake.Direct.Tests.csproj -c Release --no-build --verbosity normal
