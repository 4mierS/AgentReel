name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore GifRecorder.sln

      - name: Build
        run: dotnet build GifRecorder.sln -c Release --no-restore

      # Test-only FFmpeg for the MP4 characterization test. Never bundled or shipped (GPL build, needed for libx264).
      - name: Download FFmpeg for tests
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "ffmpeg")
          $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP "ffmpeg") -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          "AGENTREEL_FFMPEG=$($exe.FullName)" >> $env:GITHUB_ENV

      # Excluded tests already fail upstream (v2.43.2):
      # - ThemeContrastTests for Dark/VeryDark: hyperlink and DataGrid header brushes miss WCAG 4.5:1.
      # - YandexUpload: needs real credentials and network.
      # - ImageComparison: test data b1.bmp/b2.bmp is missing from the upstream repo.
      - name: Test
        run: >
          dotnet test ScreenToGif.Test/ScreenToGif.Test.csproj -c Release --no-build --verbosity normal
          --filter "DisplayName!~Dark.xaml&FullyQualifiedName!~YandexUpload&FullyQualifiedName!~ImageComparison"

      - name: Build capture spike
        run: dotnet build Spikes/AgentReel.CaptureSpike/AgentReel.CaptureSpike.csproj -c Release
